<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bwipo — APK DEV</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #070b18;
      color: #f8fafc;
    }
    main { max-width: 28rem; padding: 1.5rem; text-align: center; }
    p { color: #94a3b8; line-height: 1.5; }
    code { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>APK DEV</h1>
    <p>
      Serviço de download do app de desenvolvimento. O WebView aponta para
      <code>crm-dev-frontend.ca31ey.easypanel.host</code>.
    </p>
    <p id="status">Nenhum APK publicado ainda.</p>
  </main>
  <script>
    fetch("/mobile-release.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var el = document.getElementById("status");
        if (data.apkUrl) {
          el.innerHTML = '<a href="' + data.apkUrl + '">Baixar APK · v' + data.versionName + "</a>";
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
